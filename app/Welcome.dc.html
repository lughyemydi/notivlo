<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: blob: 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file: data: blob: https://tftwbhkypzsrhwaxkgbr.supabase.co; worker-src 'none'; child-src 'none'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>notivlo — Welcome</title>
<script>
  // Reached straight after signing up, so there is always an account by now.
  // Anyone else belongs on the sign-in page.
  try {
    if (!localStorage.getItem('folio_session')) {
      location.replace('SignIn.dc.html');
    }
  } catch (e) {}
</script>
<script src="./theme.js"></script>
<script src="./text-size.js"></script>
<script src="./support.js"></script>
<!-- The backend. Inert while supabase-config.js holds no project: with it
     empty every page below falls back to localStorage, which is how the app
     worked before there was a server. Order matters — each file depends on
     the one above it, and they are in <head> rather than <helmet> for the
     reason written at the top of auth.js. -->
<script src="./supabase-config.js"></script>
<script src="./supabase-client.js"></script>
<script src="./supabase-auth.js"></script>
<script src="./supabase-sync.js"></script>
<!-- The setup guide, so Continue below knows whether to offer it. Nothing on
     this page changes: with the guide off (setup/setup-flag.js) or already
     finished, Continue goes straight to Home as it always did. -->
<script src="./setup/setup-flag.js"></script>
<script src="./setup/setup-store.js"></script>
<script src="./setup/setup-content.js"></script>
<script src="./setup/setup-service.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/classical-7f8d5a7b-9468-49ed-9e34-e366ba30e0e2/styles.css">
<link rel="stylesheet" href="soft-clay.css">
<!-- Flat theme over the clay one. See the file head; remove this line to go back. -->
<link rel="stylesheet" href="concrete-signal.css">
<script src="_ds/classical-7f8d5a7b-9468-49ed-9e34-e366ba30e0e2/_ds_bundle.js"></script>
<style>
  body{margin:0;background:var(--color-bg);color:var(--color-text)}
  .wl-card{width:100%;max-width:760px;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-6);background:var(--color-surface);border:1px solid var(--color-border);border-radius:28px;box-shadow:0 18px 40px rgba(72,62,50,.10),inset 0 1px 0 rgb(var(--clay-edge) / .7)}
  .wl-section{display:flex;flex-direction:column;gap:var(--space-3)}
  .wl-h2{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:22px;margin:2px 0 0}
  .wl-hint{margin:0;font-size:13px;line-height:1.5;color:var(--color-neutral-600);max-width:62ch}
  .wl-foot{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-4);flex-wrap:wrap;padding-top:var(--space-2);border-top:1px solid var(--color-border)}
  .glass-btn-primary{transition:background .18s ease, transform .12s ease}
  .glass-btn-primary:hover{background:var(--color-primary-hover) !important;transform:translateY(-1px)}
  .glass-btn-primary:active{transform:translateY(0px) scale(.98)}
  @keyframes floatA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,50px) scale(1.08)}}
  @keyframes floatB{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-50px,30px) scale(.94)}}
  @media (max-width: 760px){
    .wl-card{padding:var(--space-6)}
  }
</style>
</helmet>

<div style="position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none">
  <div style="position:absolute;width:560px;height:560px;top:-160px;right:-120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--color-accent-300),transparent 70%);filter:blur(60px);opacity:.55;animation:floatA 18s ease-in-out infinite alternate"></div>
  <div style="position:absolute;width:460px;height:460px;bottom:-160px;left:-100px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--color-accent-2-300),transparent 70%);filter:blur(60px);opacity:.5;animation:floatB 22s ease-in-out infinite alternate"></div>
</div>

<div style="position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-6);font-family:var(--font-body)">
  <div class="wl-card">

    <div style="text-align:center">
      <div class="nav-brand" style="font-size:22px;margin-bottom:var(--space-2)"><span class="brand-logo brand-logo--lg">notivlo</span></div>
      <h1 style="font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:28px;margin:0 0 4px">{{ heading }}</h1>
      <p style="margin:0;color:var(--color-neutral-600);font-size:14px">Two quick choices. Both can be changed later in Settings.</p>
    </div>

    <div class="wl-section">
      <div>
        <div class="card-kicker">Appearance</div>
        <h2 class="wl-h2">Light or dark</h2>
      </div>
      <p class="wl-hint">Match system follows your device and switches when it does.</p>
      <div class="ts-options">
        <sc-for list="{{ themes }}" as="th" hint-placeholder-count="3">
          <button type="button" class="ts-option theme-option {{ th.activeClass }}" onClick="{{ th.pick }}" aria-pressed="{{ th.pressed }}">
            <span class="theme-preview" aria-hidden="true">
              <span class="tp-half {{ th.leftClass }}"><span class="tp-bar"></span><span class="tp-line"></span><span class="tp-line tp-line-short"></span></span>
              <span class="tp-half {{ th.rightClass }}"><span class="tp-bar"></span><span class="tp-line"></span><span class="tp-line tp-line-short"></span></span>
            </span>
            <span class="ts-label">{{ th.label }}</span>
            <span class="ts-pct">{{ th.note }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="wl-section">
      <div>
        <div class="card-kicker">Text size</div>
        <h2 class="wl-h2">How big everything reads</h2>
      </div>
      <p class="wl-hint">Each step scales the whole app, so spacing and buttons keep up with the text.</p>
      <div class="ts-options">
        <sc-for list="{{ textSizes }}" as="ts" hint-placeholder-count="4">
          <button type="button" class="ts-option {{ ts.activeClass }}" onClick="{{ ts.pick }}" aria-pressed="{{ ts.pressed }}">
            <span class="ts-swatch" style="font-size:{{ ts.sampleSize }}">Aa</span>
            <span class="ts-label">{{ ts.label }}</span>
            <span class="ts-pct">{{ ts.percent }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="wl-foot">
      <button type="button" class="btn btn-primary glass-btn-primary" onClick="{{ go }}" style="border-radius:999px;padding-inline:var(--space-6);background:var(--color-primary);border:1px solid var(--color-primary);color:var(--color-text-primary);box-shadow:inset 0 1px 0 rgb(var(--clay-edge) / .35)">Continue</button>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SESSION_KEY = 'folio_session';

function firstName() {
  try {
    const session = JSON.parse(localStorage.getItem(SESSION_KEY)) || {};
    const name = String(session.name || '').trim();
    return name ? name.split(/\s+/)[0] : '';
  } catch (e) { return ''; }
}

class Component extends DCLogic {
  state = {
    theme: currentTheme().id,
    themeResolved: currentTheme().resolved,
    textSize: readTextSizeId(),
  };

  componentDidMount() {
    // Light or dark and the text size are chosen here, on a brand new
    // account, so this is the first thing there is to send.
    if (window.notivloSync && window.notivloSync.enabled()) window.notivloSync.sync();
    // Picking Match system on a device that changes appearance on a schedule
    // should update the tile's "Now light / Now dark" note as it happens.
    this.onThemeChange = (e) => this.setState({ theme: e.detail.id, themeResolved: e.detail.resolved });
    window.addEventListener('notivlo:themechange', this.onThemeChange);
  }

  componentWillUnmount() {
    window.removeEventListener('notivlo:themechange', this.onThemeChange);
  }

  // Both choices apply as they're made — the page itself changes under the
  // tiles, which is the clearest preview there is.
  pickTheme(id) {
    saveTheme(id);
    const t = currentTheme();
    this.setState({ theme: t.id, themeResolved: t.resolved });
  }

  pickTextSize(id) {
    saveTextSize(id);
    this.setState({ textSize: id });
  }

  go() {
    // The setup guide, when it is on and this device has not already been
    // through it. Everything else — the guide switched off, a second visit,
    // the file missing entirely — goes to Home, which is where this line
    // went before the guide existed.
    const offer = window.notivloSetup && window.notivloSetup.shouldOffer();
    window.location.href = offer ? 'Setup.dc.html' : 'Home.dc.html';
  }

  renderVals() {
    const name = firstName();
    return {
      heading: name ? 'Welcome, ' + name : 'Welcome to notivlo',

      themes: THEMES.map(th => ({
        label: th.label,
        note: th.id !== 'system' ? 'Always ' + th.id
          : this.state.theme === 'system' ? 'Now ' + this.state.themeResolved : 'Follows device',
        leftClass: th.id === 'dark' ? 'tp-dark' : 'tp-light',
        rightClass: th.id === 'light' ? 'tp-light' : 'tp-dark',
        activeClass: th.id === this.state.theme ? 'ts-option-active' : '',
        pressed: th.id === this.state.theme,
        pick: () => this.pickTheme(th.id),
      })),

      textSizes: TEXT_SCALES.map(ts => ({
        label: ts.label,
        sampleSize: Math.round(15 * ts.scale) + 'px',
        percent: Math.round(ts.scale * 100) + '%',
        activeClass: ts.id === this.state.textSize ? 'ts-option-active' : '',
        pressed: ts.id === this.state.textSize,
        pick: () => this.pickTextSize(ts.id),
      })),

      go: () => this.go(),
    };
  }
}

</script>
</body>
</html>
